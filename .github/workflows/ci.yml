name: 构建与测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.12.0'
  CMAKE_BUILD_PARALLEL_LEVEL: '3'
  CTEST_PARALLEL_LEVEL: '2'

jobs:
  format:
    name: 格式检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/requirements-code-tools.txt
      - run: python -m pip install -r tools/requirements-code-tools.txt
      - run: python tools/check-format.py

  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-debug
            host: linux
            arch: linux_gcc_64
          - os: ubuntu-24.04
            preset: linux-release
            host: linux
            arch: linux_gcc_64
          - os: ubuntu-24.04
            preset: linux-static
            host: linux
            arch: linux_gcc_64
          - os: windows-2022
            preset: windows-release
            host: windows
            arch: win64_msvc2022_64
          - os: macos-15
            preset: macos-release
            host: mac
            arch: clang_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: 初始化 MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 安装 Linux 运行依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: 安装 Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          archives: qtbase qttools
          install-deps: false
          cache: true
          cache-key-prefix: qt-base-tools-v1
      - name: 配置
        env:
          QT_ROOT: ${{ steps.qt.outputs.qt-root-dir }}
        run: cmake --preset '${{ matrix.preset }}' -DELAWIDGETTOOLS_BUILD_TESTS=ON
      - name: 编译
        run: cmake --build --preset '${{ matrix.preset }}'
      - name: QtTest
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ctest --preset '${{ matrix.preset }}' --output-junit "$GITHUB_WORKSPACE/qt-test-results.xml"
          else
            ctest --preset '${{ matrix.preset }}' --output-junit "$GITHUB_WORKSPACE/qt-test-results.xml"
          fi
      - name: 安装及部署
        run: cmake --install 'build/${{ matrix.preset }}'
      - name: 验证安装后的 CMake 包
        env:
          QT_ROOT: ${{ steps.qt.outputs.qt-root-dir }}
        run: |
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install/${{ matrix.preset }};$QT_ROOT"
          cmake --build build/consumer
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ctest --test-dir build/consumer --output-on-failure --no-tests=error
          else
            ctest --test-dir build/consumer --output-on-failure --no-tests=error
          fi
      - name: 检查 macOS 部署结果并启动
        if: runner.os == 'macOS'
        run: python3 tools/check-macos-bundle.py 'install/${{ matrix.preset }}/ElaWidgetToolsExample.app'
      - name: 保存构建和测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.preset }}
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/Testing/
            build/consumer/Testing/
            qt-test-results.xml
            macos-smoke.log
      - name: 保存 macOS 应用
        if: success() && runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'install/${{ matrix.preset }}/ElaWidgetToolsExample.app' ElaWidgetToolsExample-macos.zip
      - name: 上传 macOS 应用
        if: success() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ElaWidgetToolsExample-macos.zip
